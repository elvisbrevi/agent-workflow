[package]
name = "lz-gui"
version = "0.1.0"
description = "Desktop GUI for the lz (lazy-workflow) CLI"
authors = ["Elvis Brevi"]
edition = "2021"
rust-version = "1.90"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:argon2", "dep:rand", "dep:url", "dep:reqwest", "dep:sha2", "dep:rpassword", "dep:jsonwebtoken", "dep:anyhow"]

[[bin]]
name = "lz-gui"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "lz-web"
path = "src/bin/lz-web.rs"
required-features = ["web"]

[lib]
name = "lz_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"], optional = true }
tower-http = { version = "0.6", features = ["fs", "limit"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }
sha2 = { version = "0.10", optional = true }
rpassword = { version = "7", optional = true }
jsonwebtoken = { version = "9.3", optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
rsa = "0.9"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
