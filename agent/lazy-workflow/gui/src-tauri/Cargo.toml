[package]
name = "lz-gui"
version = "0.1.0"
description = "Desktop GUI for the lz (lazy-workflow) CLI"
authors = ["Elvis Brevi"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "lz_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
